# Builds the Bayonetta runtime as an Android app with no game code in it: the recompiled game is
# replaced by an empty stand-in (recomp/runtime/ci/make_stub_ppc.sh). This checks that the
# runtime, Xenia's GPU and SDL compile, link and package for Android. The playable APK needs the
# owner's own copy of the game and is never built in this public repository.
name: recomp Android check

on:
  push:
    paths: ["recomp/**", ".github/workflows/recomp-android-check.yml"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq ninja-build clang glslang-tools spirv-tools
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;35.0.0" "ndk;27.2.12479018" > /dev/null

      - name: Sources (Xenia, SDL, XenonRecomp)
        run: IPS3_SOURCES_ONLY=1 recomp/setup.sh

      - name: Build
        run: |
          recomp/runtime/ci/make_stub_ppc.sh "$RUNNER_TEMP/stub"
          ANDROID_NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018" ANDROID_SDK="$ANDROID_SDK_ROOT" \
            recomp/android/build_apk.sh Bayonetta-nogame.apk "$RUNNER_TEMP/stub/ppc"

      - uses: actions/upload-artifact@v4
        with:
          name: Bayonetta-nogame-apk
          path: Bayonetta-nogame.apk
